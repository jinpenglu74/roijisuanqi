name: Build ROI Calculator Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "ROI智能计算器" main.py

      - name: Prepare release files
        shell: cmd
        run: |
          mkdir release
          copy dist\ROI智能计算器.exe release\
          copy README.md release\

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y

      - name: Build Setup Installer
        shell: cmd
        run: |
          iscc installer\ROI计算器安装脚本.iss

      - name: Check installer output
        shell: cmd
        run: |
          dir installer
          dir installer\Output

      - name: Upload Setup EXE
        uses: actions/upload-artifact@v4
        with:
          name: ROI智能计算器_Setup_V1.1.0
          path: installer\Output\ROI智能计算器_Setup_V1.1.0.exe
