name: Build ROI Calculator Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --onefile --windowed --name ROI智能计算器 main.py

      - name: Package installer files
        run: |
          mkdir release
          copy dist\ROI智能计算器.exe release\
          copy README.md release\

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ROI智能计算器-Windows版
          path: release
