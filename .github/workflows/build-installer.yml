name: Build ROI Calculator Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Verify PySide6
        run: |
          python -c "import PySide6; print('PySide6 OK')"

      - name: Build Portable EXE
        run: |
          pyinstaller --noconfirm --onedir --windowed --collect-all PySide6 --name "ROI智能计算器" main.py

      - name: Prepare Portable Package
        shell: cmd
        run: |
          mkdir portable\ROI智能计算器_V1.2.1
          xcopy dist\ROI智能计算器 portable\ROI智能计算器_V1.2.1 /E /I
          copy README.md portable\ROI智能计算器_V1.2.1\

      - name: Build Single EXE
        run: |
          pyinstaller --noconfirm --onefile --windowed --collect-all PySide6 --name "ROI智能计算器" main.py

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y

      - name: Build Setup Installer
        shell: cmd
        run: |
          iscc installer\ROI计算器安装脚本.iss

      - name: Create Portable Zip
        shell: powershell
        run: |
          Compress-Archive -Path portable\ROI智能计算器_V1.2.1 -DestinationPath ROI智能计算器_Portable_V1.2.1.zip

      - name: Check Output
        shell: cmd
        run: |
          dir installer\Output
          dir ROI智能计算器_Portable_V1.2.1.zip

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: ROI智能计算器_Setup_V1.2.1
          path: installer\Output\ROI智能计算器_Setup_V1.2.1.exe

      - name: Upload Portable
        uses: actions/upload-artifact@v4
        with:
          name: ROI智能计算器_Portable_V1.2.1
          path: ROI智能计算器_Portable_V1.2.1.zip
