name: Build ROI Calculator Portable

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '*.md'
      - 'README.md'

permissions:
  contents: write

jobs:
  build-windows-portable:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Verify environment
        run: |
          python -c "import PySide6; print('PySide6 OK')"

      - name: Build portable application
        run: |
          pyinstaller --noconfirm --onedir --windowed --collect-all PySide6 --name "ROI智能计算器" main.py

      - name: Verify portable output
        shell: powershell
        run: |
          if (!(Test-Path "dist\ROI智能计算器\ROI智能计算器.exe")) { exit 1 }
          Write-Host "Portable EXE found"

      - name: Package portable zip
        shell: powershell
        run: |
          Compress-Archive -Path dist\ROI智能计算器 -DestinationPath ROI智能计算器_Portable.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ROI智能计算器_Portable
          path: ROI智能计算器_Portable.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ROI智能计算器_Portable.zip
          generate_release_notes: true
