name: Build ROI Calculator Portable

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - 'README.md'

permissions:
  contents: read

jobs:
  build-windows-portable:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Verify environment
        run: |
          python -c "import PySide6; print('PySide6 OK')"

      - name: Build portable application
        run: |
          pyinstaller --noconfirm --onedir --windowed --collect-all PySide6 --name "ROI智能计算器" main.py

      - name: Verify portable output
        shell: powershell
        run: |
          Get-ChildItem -Path dist -Recurse
          $exe = Get-ChildItem -Path dist -Filter *.exe -Recurse | Select-Object -First 1
          if ($null -eq $exe) { throw 'Portable EXE not found' }
          Write-Host "Portable EXE found: $($exe.FullName)"

      - name: Package portable zip
        shell: powershell
        run: |
          $zipPath = Join-Path $env:GITHUB_WORKSPACE 'ROI智能计算器_Portable.zip'
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path "$env:GITHUB_WORKSPACE\dist\*" -DestinationPath $zipPath -Force
          if (!(Test-Path $zipPath)) { throw 'Portable zip not created' }
          Get-Item $zipPath
          Write-Host "Portable zip created: $zipPath"

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: ROI智能计算器_Portable
          path: ${{ github.workspace }}/ROI智能计算器_Portable.zip
